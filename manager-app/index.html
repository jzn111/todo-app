<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图书收藏</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; max-width: 560px; margin: 24px auto; padding: 0 16px; }
    h1 { color: #333; }
    form { margin-bottom: 16px; }
    input, select, button { padding: 6px 10px; margin-bottom: 8px; }
    input[type="text"] { width: 160px; }
    .tip { color: #c00; font-size: 14px; min-height: 20px; }
    .search-box { margin: 12px 0; }
    .book-item { border-bottom: 1px solid #eee; padding: 8px 0; display: flex; align-items: center; gap: 8px; }
    .book-item .info { flex: 1; }
    .book-item .title { font-weight: bold; }
    .book-item .author { color: #666; font-size: 14px; }
    .book-item .rating { color: #f60; }
    .book-item .actions button { margin-left: 4px; cursor: pointer; padding: 2px 8px; font-size: 13px; }
    .edit-form { display: inline; }
    .edit-form input { width: 100px; padding: 2px 6px; }
    .empty-tip { color: #999; padding: 12px 0; }
  </style>
</head>
<body>
  <h1>图书收藏</h1>
  <form id="add-form">
    <input type="text" id="title-input" placeholder="书名">
    <input type="text" id="author-input" placeholder="作者">
    <select id="rating-input">
      <option value="">评分</option>
      <option value="5">5分</option>
      <option value="4">4分</option>
      <option value="3">3分</option>
      <option value="2">2分</option>
      <option value="1">1分</option>
    </select>
    <button type="submit">添加</button>
  </form>
  <p class="tip" id="tip"></p>
  <div class="search-box">
    <input type="text" id="search-input" placeholder="搜索书名或作者…">
  </div>
  <div id="book-list"></div>
  <script src="app.js"></script>
</body>
</html>
